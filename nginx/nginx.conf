events {}

http {
    # Nothing was compressed before this: every response comes from the `web` upstream, and
    # Starlette's StaticFiles does not gzip, so the JS module tree and style.css went over the
    # wire whole. See docs/frontend_bundle_plan_todo.md.
    gzip on;
    # Required — without it nginx skips compression for any request it is proxying, which is
    # all of them.
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    # Content-Type comes from the upstream, so these are what Python's mimetypes returns:
    # `.js` and `.mjs` are text/javascript, and a sourcemap has no known type and arrives as
    # StaticFiles' text/plain fallback. text/html is always compressed and needs no entry.
    gzip_types
        text/javascript
        application/javascript
        text/css
        application/json
        image/svg+xml
        text/plain;

    server {
        listen 80;
        server_name brainwidebench.iblcore.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        # Multiplexes the page's requests over the one connection the document already opened,
        # instead of HTTP/1.1's six-per-origin. The separate `http2 on;` directive is nginx
        # 1.25+; the image is 1.27.
        http2 on;
        server_name brainwidebench.iblcore.org;

        ssl_certificate     /etc/letsencrypt/live/brainwidebench.iblcore.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/brainwidebench.iblcore.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        client_max_body_size 512M;

        # Re-resolve upstream on each request so container IP changes after deploys don't cause 502.
        resolver 127.0.0.11 valid=5s;
        set $upstream http://web:8080;

        location / {
            proxy_pass $upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}

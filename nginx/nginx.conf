events {}

http {
    # Every response is proxied from `web`; gzip_proxied is what lets those be compressed.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    # Types as the upstream sends them: Python's mimetypes calls `.js` text/javascript, and a
    # sourcemap has no known type and arrives as StaticFiles' text/plain fallback.
    gzip_types
        text/javascript
        application/javascript
        text/css
        application/json
        image/svg+xml
        text/plain;

    server {
        listen 80;
        server_name bwb.iblcore.org;
        return 301 https://$host$request_uri;
    }

    # Old domain, kept only to 301 anyone with a stale bookmark/link (e.g. ibl-benchmark's
    # README) onto the real site. Cert renews on its own normal certbot schedule; drop this
    # block and let the cert lapse once nothing points here anymore.
    server {
        listen 80;
        server_name brainwidebench.iblcore.org;
        return 301 https://bwb.iblcore.org$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name brainwidebench.iblcore.org;

        ssl_certificate     /etc/letsencrypt/live/brainwidebench.iblcore.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/brainwidebench.iblcore.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        return 301 https://bwb.iblcore.org$request_uri;
    }

    server {
        listen 443 ssl;
        # The separate directive, not `listen ... http2`, which is deprecated in nginx 1.25+.
        http2 on;
        server_name bwb.iblcore.org;

        ssl_certificate     /etc/letsencrypt/live/bwb.iblcore.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bwb.iblcore.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        client_max_body_size 512M;

        # Re-resolve upstream on each request so container IP changes after deploys don't cause 502.
        # Also used to resolve the GitHub Pages upstream below — Docker's embedded DNS
        # forwards external lookups, not just container names.
        resolver 127.0.0.11 valid=5s;
        set $upstream http://web:8080;

        # ibl-benchmark's Sphinx docs, published via GitHub Pages, reverse-proxied under a
        # subpath so they read as part of this site instead of a separate github.io domain.
        # The bare path redirects to the trailing-slash form first: Sphinx's relative asset
        # links (../_static/...) are resolved by the browser against the current URL, so
        # without the trailing slash they'd resolve one level too high and 404.
        location = /docs {
            return 301 /docs/;
        }

        location /docs/ {
            proxy_pass https://brainbench-org.github.io/ibl-bwb/;
            # GitHub Pages is name-based virtual hosting — both the Host header and the TLS
            # SNI sent upstream must be its own hostname, not $host (which is bwb.iblcore.org
            # here), or Fastly's edge won't know which site to serve.
            proxy_set_header Host brainbench-org.github.io;
            proxy_ssl_server_name on;
            proxy_ssl_name brainbench-org.github.io;
        }

        location / {
            proxy_pass $upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}

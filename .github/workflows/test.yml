name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # Check out both repos as siblings so the `../ibl-benchmark` path dependency
      # resolves, mirroring the local layout and the Docker build context.
      - name: Check out app-brain-wide-bench
        uses: actions/checkout@v4
        with:
          path: app-brain-wide-bench
      - name: Check out ibl-benchmark
        uses: actions/checkout@v4
        with:
          repository: neuro-galaxy/ibl-benchmark
          # Cross-org private repo: needs a PAT (or deploy key) with read access,
          # stored as the IBL_BENCH_PAT repo/org secret. Pin `ref:` to a tag/SHA
          # for a reproducible build.
          ref: main
          token: ${{ secrets.IBL_BENCH_PAT }}
          path: ibl-benchmark
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync dependencies
        working-directory: app-brain-wide-bench
        run: uv sync
      - name: Run tests
        working-directory: app-brain-wide-bench
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # Only this repo: the frontend has no path dependency on ibl-benchmark.
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's build stage.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Unit tests
        run: npm test
      # The same build the image runs. A failure here is a failure of the deploy.
      - name: Build
        run: npm run build
[project]
name = "app-brain-wide-bench"
version = "0.1.0"
description = "brain-wide-bench neural model benchmarking platform — backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "celery[redis]>=5.4",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2", # single driver: async for FastAPI, sync for Alembic
    "alembic>=1.13",
    "boto3>=1.34",
    "python-jose[cryptography]>=3.3",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "ibl-bwb-eval==0.0.1",
    "python-dotenv>=1.0",
    "sqlmodel>=0.0.38",
    "torch==2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "aiosqlite>=0.20",
]

[tool.uv]
python-preference = "managed"

[tool.uv.sources]
# torch only ever runs inference on the Docker host's CPU here, never training. The
# default PyPI wheel for linux/x86_64 bundles the CUDA runtime and a dozen
# nvidia-*-cu12 packages (multiple GB), which has bloated this image before. Pinned
# directly below (it's otherwise only a transitive dep of ibl-bwb-eval[scoring]) so
# this source override actually applies — uv only honors [tool.uv.sources] for a
# package the project declares itself. macOS keeps resolving from PyPI as normal —
# it has no CUDA variant to avoid in the first place.
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain-Wide Bench - Submission</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-view="private">

    <div class="main-private">

      <nav class="nav" id="top-nav"></nav>
      <aside class="sidebar" id="side-nav"></aside>

      <div class="content-private">

          <a class="link" href="submission_list.html">← Back to submissions</a>

          <div class="page-header">
            <h1 class="section-title" id="page-title">Submission</h1>
            <p class="section-description" id="page-description"></p>
          </div>

          <div id="form-message" hidden></div>

          <div class="tab-row">
            <div class="tab active" data-tab="overview">Overview</div>
            <div class="tab" data-tab="details">Details</div>
            <div class="tab" data-tab="tasks">Tasks</div>
            <div class="tab" data-tab="evaluation">Evaluation</div>
          </div>

          <section class="model-overview" data-tab="overview">
            <div class="model-scores">
              <div class="card secondary column gap-lg">
                <div class="column gap-xs" id="overall-score-card"></div>
                <div class="column gap-lg" id="suite-list"></div>
              </div>
            </div>

            <div class="model-stats grid-4" id="submission-stats"></div>

            <div class="model-details card secondary column gap-lg">
              <span class="card-description">Details</span>
              <div class="column gap-lg" id="submission-details"></div>
              <span class="link push-end" id="see-all-details-link">See all submission details →</span>
            </div>
          </section>

          <section class="tab-section" data-tab="details" hidden>
            <div class="card secondary column gap-lg">
              <div class="row">
                <span class="card-title">Submission details</span>
                <span class="btn" id="edit-submission">Edit</span>
              </div>
              <div class="column gap-lg" id="submission-details-full"></div>
            </div>
          </section>

          <section class="tab-section" data-tab="details-edit" hidden>
            <div class="card secondary column gap-lg">
              <div class="row">
                <span class="card-title">Update submission</span>
                <div class="row gap-md">
                  <span class="btn primary" id="save-submission">Save Changes</span>
                  <span class="btn" id="cancel-submission">Cancel</span>
                </div>
              </div>
              <div class="column gap-lg" id="submission-details-edit"></div>
            </div>
          </section>

          <section class="tab-section" data-tab="tasks" hidden>
            <div class="column gap-md">
              <span class="card-description" id="task-card-count"></span>
              <div class="column gap-md" id="task-card-list"></div>
            </div>
          </section>

          <section class="tab-section" data-tab="evaluation" hidden>
            <div class="grid-3" id="evaluation-suites"></div>
          </section>

      </div>
    </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="js/nav_top.js"></script>
  <script type="module" src="js/nav_side.js"></script>
  <script type="module" src="js/submissions/details/details.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain-Wide Bench - Edit team</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body data-view="private">

    <div class="main-private">

      <aside class="sidebar" id="side-nav"></aside>

      <div class="content-private">


        <div class="card" id="gate" hidden>
          <div class="column gap-md">
            <p>Please sign in to view this team's details.</p>
            <button class="btn primary" id="gate-login">Sign in</button>
          </div>
        </div>

        <a class="link un" id="back-to-team"></a>

        <div class="row">
          <div class="page-header side">
            <h1 class="page-title" id="team-title"></h1>
            <p class="section-description" id="team-description"></p>
          </div>

          <div class="row right gap-md">
            <a class="btn with-icon" id="edit-team">
              <i class="btn-icon" data-lucide="pencil"></i>
              Edit
            </a>
            <a class="btn primary with-icon" id="save-team" hidden>
              <i class="btn-icon" data-lucide="check"></i>
              Save
            </a>
            <a class="btn with-icon" id="cancel-team" hidden>
              <i class="btn-icon" data-lucide="x"></i>
              Cancel
            </a>
          </div>
        </div>

        <div id="form-message" hidden></div>

        <!-- The details card and the members card, spaced by gap-lg exactly as the two
             fieldsets on team_create.html are. This replaced a .page-section around the
             members block, whose own `margin-bottom: 50px` made the two pages disagree. -->
        <div class="column gap-lg">

          <div id="team-details"></div>

          <!-- The same block team_create.html mounts; see js/teams/teamMembers.js.
             Staged here: changes wait for the Save above, which applies them with the
             rename.

             Lookup and table share one card, as on the create page. The card title stands
             in for the section heading the page used to carry — the details card above it
             has one too, so a separate <h2> made this the only section titled twice. -->
          <div class="card column gap-md">
            <p class="title muted">Members</p>

            <!-- Hidden outside edit mode by teamMembers.js: there is nothing to
                 look someone up *for* until the page is editable. -->
            <div class="column gap-xs" id="member-add" hidden>
              <label class="field-label" for="member-search">Add a member</label>
              <input class="field-input" id="member-search" type="search"
                     placeholder="Full name or email address" autocomplete="off">
              <p class="info-msg">
                Enter the whole name or email — partial matches aren't looked up. They must
                have signed in at least once before they can be added.
              </p>

              <!-- The match, with an Add button. Hidden until there is one. -->
              <div class="column gap-sm" id="member-results" hidden></div>
            </div>

            <div id="member-list"></div>
          </div>

          <!-- Only filled in when the page was reached straight from team_create.html —
               see renderPostCreate in js/teams/teamDetails.js. -->
          <div id="team-post-create"></div>

        </div>

      </div>
    </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="/js/nav/nav_side.js"></script>
  <script type="module" src="/js/teams/teamDetails.js"></script>

</body>
</html>

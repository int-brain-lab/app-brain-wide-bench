<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain-Wide Bench - Edit team</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body data-view="private">

    <div class="main-private">

      <aside class="sidebar" id="side-nav"></aside>

      <div class="content-private">

        <a class="link un" id="back-to-team"></a>

        <div class="row">
          <div class="page-header side">
            <h1 class="page-title" id="team-title"></h1>
            <p class="section-description" id="team-description"></p>
          </div>

          <div class="row right gap-md">
            <a class="btn with-icon" id="edit-team">
              <i class="btn-icon" data-lucide="pencil"></i>
              Edit
            </a>
            <a class="btn primary with-icon" id="save-team" hidden>
              <i class="btn-icon" data-lucide="check"></i>
              Save
            </a>
            <a class="btn with-icon" id="cancel-team" hidden>
              <i class="btn-icon" data-lucide="x"></i>
              Cancel
            </a>
          </div>
        </div>

        <div id="form-message" hidden></div>

        <div id="team-details"></div>

        <!-- The same block team_members.html mounts; see js/teams/teamMembersSection.js.
             Staged here: changes wait for the Save above, which applies them with the
             rename. Read-only until Edit is clicked. -->
        <section class="page-section">
          <div class="row">
            <h2 class="section-title">Members</h2>
          </div>

          <!-- Hidden outside edit mode by teamMembersSection.js. -->
          <div class="card column gap-md" id="member-add" hidden>
            <div class="column gap-xs">
              <label class="field-label" for="member-search">Add a member</label>
              <input class="field-input" id="member-search" type="search"
                     placeholder="Full name or email address" autocomplete="off">
              <p class="info-msg">
                Enter the whole name or email — partial matches aren't looked up. They must
                have signed in at least once before they can be added.
              </p>
            </div>

            <div class="column gap-sm" id="member-results" hidden></div>
          </div>

          <div id="member-list"></div>
        </section>

      </div>
    </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="/js/nav/nav_side.js"></script>
  <script type="module" src="/js/teams/teamDetails.js"></script>

</body>
</html>

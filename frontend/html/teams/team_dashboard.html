<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain-Wide Bench - Team</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body data-view="private">

    <div class="main-private">

      <aside class="sidebar" id="side-nav"></aside>

      <div class="content-private">

          <a class="link" href="/html/teams/team_list.html">← Back to teams</a>

          <div class="row">
            <div class="page-header side">
              <h1 class="page-title" id="page-title">Team</h1>
              <p class="section-description" id="page-description"></p>
            </div>

            <!-- href set in teamDashboard.js, which has the team id. Hidden for a
                 non-member — the rename would 403. -->
            <div class="row right gap-md">
              <a class="btn with-icon" id="edit-team" href="#" hidden>
                <i class="btn-icon" data-lucide="pencil"></i>
                Edit
              </a>
            </div>
          </div>

          <div id="form-message" hidden></div>


          <section class="page-section">
            <div class="row">
              <h2 class="section-title">Members</h2>
              <!-- Beside the section it acts on, rather than in the page header. -->
              <a class="btn primary with-icon" id="manage-members" href="#" hidden>
                <i class="btn-icon" data-lucide="users"></i>
                Manage members
              </a>
            </div>
            <div id="member-list"></div>
          </section>

      </div>
    </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="/js/nav/nav_side.js"></script>
  <script type="module" src="/js/teams/teamDashboard.js"></script>

</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain-Wide Bench - Team</title>
    <!-- Handshakes for the script origins at the end of the body. -->
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://cdn.auth0.com" />
    <!-- Tabulator's stylesheet first so style.css's `.tabulator` overrides win, same order as
       the other pages that mount a grid. -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <!-- One URL for both audiences, and no gate: a team's page is readable signed out,
         minus the member list. The markup is the public shell; a team the reader belongs to
         swaps in the sidebar instead, once the record has come back and said so — see
         `privateShell` in templates/page.js. -->
    <div class="main">
      <nav class="nav" id="top-nav"></nav>

      <aside class="sidebar" id="side-nav" hidden></aside>

      <div class="content">
        <div id="container"></div>
      </div>

      <!-- Footer -->
      <footer class="page-footer row" id="page-footer"></footer>
    </div>

    <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
    <!-- Chart.js as a UMD global, matching how Tabulator and lucide are loaded: the
       task-score explorer behind "View all scores" plots a comparison here, and
       charts/chart.js says which script is missing if it isn't there. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@1.42.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
    <script type="module" src="/js/nav/navTop.js"></script>
    <script type="module" src="/js/nav/navFooter.js"></script>
    <script type="module" src="/js/nav/navSide.js"></script>
    <script type="module" src="/js/pages/teamView.js"></script>
  </body>
</html>

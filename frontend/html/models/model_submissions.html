<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain-Wide Bench - Model submissions</title>
  <!-- Tabulator's stylesheet first so style.css's `.tabulator` overrides win,
       same order as dashboard.html and leaderboard.html. -->
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body data-view="private">

    <div class="main-private">

      <aside class="sidebar" id="side-nav"></aside>

      <div class="content-private">

        <div class="card" id="gate" hidden>
          <div class="column gap-md">
            <p>Please sign in to view this model's submissions.</p>
            <button class="btn primary" id="gate-login">Sign in</button>
          </div>
        </div>

          <a class="link un" id="back-to-model" href="/html/models/model_list.html">← Back</a>

          <div class="page-header side">
            <h1 class="page-title" id="page-title">Submissions</h1>
            <p class="section-description" id="page-description"></p>
          </div>

          <section class="page-section">
            <div id="submissions-list"></div>
          </section>

      </div>
    </div>

  <!-- A classic script, so it runs before the deferred module below regardless of
       position — js/utils/tables.js reads `Tabulator` off the global. -->
  <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="/js/nav/nav_side.js"></script>
  <script type="module" src="/js/models/modelSubmissions.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain-Wide Bench - My model</title>
  <!-- Tabulator's stylesheet first so style.css's `.tabulator` overrides win, same order as
       the other pages that mount a grid. Without it Tabulator's JS still builds its rows —
       it renders nested divs rather than a real <table> — but every cell falls back to a
       plain block and the whole grid stacks vertically. -->
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body data-view="private">

    <div class="main-private">

      <aside class="sidebar" id="side-nav"></aside>

      <div class="content-private">

        <div class="card" id="gate" hidden>
          <div class="column gap-md">
            <p>Please sign in to view this model.</p>
            <button class="btn primary" id="gate-login">Sign in</button>
          </div>
        </div>

        <div id="container"></div>

      </div>
    </div>

  <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="/js/nav/nav_top.js"></script>
  <script type="module" src="/js/nav/nav_side.js"></script>
  <script type="module" src="/js/models/modelView.js"></script>

</body>
</html>

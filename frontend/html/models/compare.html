<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain-Wide Bench - Compare models</title>
  <!-- Tabulator's stylesheet first so style.css's `.tabulator` overrides win, same order as
       the other pages that mount a grid. -->
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <!-- One URL for both audiences, and no gate: a public model is comparable signed out.
         The markup is the public shell and shell.js swaps in the sidebar for a signed-in
         reader — same arrangement as models.html, which this page is reached from. -->
    <div class="main">

      <nav class="nav" id="top-nav"></nav>

      <aside class="sidebar" id="side-nav" hidden></aside>

      <div class="content">

        <div id="container"></div>

      </div>
    </div>

  <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
  <!-- Chart.js as a UMD global, matching how Tabulator and lucide are loaded: the model
       comparison plots the task breakdown here, and charts/chart.js says which script is
       missing if it isn't there. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
  <script type="module" src="/js/nav/navTop.js"></script>
  <script type="module" src="/js/nav/navSide.js"></script>
  <script type="module" src="/js/pages/compare.js"></script>

</body>
</html>

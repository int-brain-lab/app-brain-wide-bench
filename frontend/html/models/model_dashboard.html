<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain-Wide Bench - My model</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body data-view="private">

    <div class="main-private">

      <aside class="sidebar" id="side-nav"></aside>

      <div class="content-private">

        <div class="card" id="gate" hidden>
          <div class="column gap-md">
            <p>Please sign in to view this model.</p>
            <button class="btn primary" id="gate-login">Sign in</button>
          </div>
        </div>

          <a class="link un" href="/html/models/model_list.html">← Back to models</a>

          <div class="row">
            <div class="page-header side">
              <h1 class="page-title" id="model-title"></h1>
              <p class="section-description" id="model-description"></p>
            </div>

            <!-- href set in JS, which has the id. Carries `&edit`, so it lands on the
                 details page already editing rather than on its read-only card. -->
            <div class="row right gap-md">
              <a class="btn with-icon" id="edit-model-link" href="#">
                <i class="btn-icon" data-lucide="pencil"></i>
                Edit
              </a>
            </div>
          </div>

          <div id="form-message" hidden></div>

          <section class="page-section">
            <div class="grid-4" id="model-stats"></div>
          </section>

          <section class="page-section">
            <div class="row">
              <h2 class="section-title">Task Suites</h2>
              <a class="btn with-icon" id="model-scores-link" href="#">
                <i class="btn-icon" data-lucide="chart-column"></i>
                View task scores
              </a>
            </div>
            <div id="model-scores"></div>
          </section>

          <section class="page-section">
            <div class="row">
              <h2 class="section-title">Model Details</h2>
              <a class="btn with-icon" id="model-details-link" href="#">
                <i class="btn-icon" data-lucide="book-open"></i>
                View model details
              </a>
            </div>
            <div id="model-details"></div>
          </section>

          <section class="page-section">
            <div class="row">
              <h2 class="section-title">Recent submissions</h2>
              <a class="btn with-icon" id="model-submissions-link" href="#">
                <i class="btn-icon" data-lucide="layers"></i>
                View all submissions
              </a>
            </div>
            <div id="model-submissions"></div>

            <!-- "New submission", rendered by renderCreateRow. Its own container rather
                 than part of #model-submissions, which the static table replaces
                 wholesale. -->
            <div id="model-submissions-create"></div>
          </section>


      </div>
    </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="/js/nav/nav_top.js"></script>
  <script type="module" src="/js/nav/nav_side.js"></script>
  <script type="module" src="/js/models/modelDashboard.js"></script>

</body>
</html>

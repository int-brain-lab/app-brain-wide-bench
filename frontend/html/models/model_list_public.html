<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain-Wide Bench - Models</title>
    <!-- Handshakes for the script origins at the end of the body. -->
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://cdn.auth0.com" />
    <!-- Tabulator's stylesheet first so style.css's `.tabulator` overrides win, same order as
       the other pages that mount a grid. Without it Tabulator's JS still builds its rows —
       it renders nested divs rather than a real <table> — but every cell falls back to a
       plain block and the whole grid stacks vertically. -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body data-scope="all">
    <!-- Every model the viewer may see, which signed out is the public ones — so no gate.
         The public shell, whoever is reading. `data-scope` is what tells modelList.js to
         list all of them rather than the viewer's own. -->
    <div class="main">
      <nav class="nav" id="top-nav"></nav>

      <div class="content">
        <div id="container"></div>
      </div>
    </div>

    <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
    <!-- Chart.js as a UMD global, matching how Tabulator and lucide are loaded: the model
       comparison plots the task breakdown here, and charts/chart.js says which script is
       missing if it isn't there. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@1.42.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
    <script type="module" src="/js/nav/navTop.js"></script>
    <script type="module" src="/js/pages/modelList.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain-Wide Bench - Task</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body data-view="private">

    <div class="main-private">

      <aside class="sidebar" id="side-nav"></aside>

      <div class="content-private">

        <div class="card" id="gate" hidden>
          <div class="column gap-md">
            <p>Please sign in to view this task.</p>
            <button class="btn primary" id="gate-login">Sign in</button>
          </div>
        </div>

        <a class="link un" id="back-to-tasks" href="/html/submissions/submission_list.html">← Back</a>

        <div class="row">
          <div class="page-header side">
            <h1 class="page-title" id="task-title"></h1>
            <p class="section-description" id="task-description"></p>
          </div>

          <div class="row right gap-md">
            <a class="btn with-icon" id="edit-task">
              <i class="btn-icon" data-lucide="pencil"></i>
              Edit
            </a>
            <!-- Shown only while editing, alongside Save. Its label names the suite,
                 filled in by taskSubmissionDetails.js. -->
            <label class="row left gap-sm" id="apply-to-suite" hidden>
              <input type="checkbox" class="field-checkbox" id="apply-to-suite-input">
              <span class="metadata" id="apply-to-suite-label"></span>
            </label>
            <a class="btn primary with-icon" id="save-task" hidden>
              <i class="btn-icon" data-lucide="check"></i>
              Save
            </a>
            <a class="btn with-icon" id="cancel-task" hidden>
              <i class="btn-icon" data-lucide="x"></i>
              Cancel
            </a>
          </div>
        </div>

        <div id="task-details"></div>

        <!-- Names the tasks a save actually changed — the only place a suite-wide apply
             is visible, since the page itself shows one task. -->
        <div id="task-message" hidden></div>

      </div>
    </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="/js/nav/nav_side.js"></script>
  <script type="module" src="/js/tasks/taskSubmissionDetails.js"></script>

</body>
</html>

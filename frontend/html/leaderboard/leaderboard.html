<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain-Wide Bench - Leaderboard</title>
    <!-- Handshakes for the script origins at the end of the body. -->
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://cdn.auth0.com" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- The public shell, as the model and submission pages are: the top nav whoever is
         reading, since nothing on the leaderboard is private and the nav carries the way
         into the signed-in half for a reader who has one. -->
    <div class="main">
      <nav class="nav" id="top-nav"></nav>

      <div class="content">
        <div id="container"></div>
      </div>

      <!-- Footer -->
      <footer class="page-footer row" id="page-footer"></footer>
    </div>

    <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
    <!-- Chart.js as a UMD global, matching how Tabulator and lucide are loaded: the model
         comparison under the board draws its scores as bars, and plots/plot.js says which
         script is missing if it isn't there. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@1.42.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
    <script type="module" src="/js/nav/navTop.js"></script>
    <script type="module" src="/js/nav/navFooter.js"></script>
    <script type="module" src="/js/pages/leaderboard.js"></script>
  </body>
</html>

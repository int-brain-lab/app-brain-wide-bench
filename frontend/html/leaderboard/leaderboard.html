<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain-Wide Bench - Leaderboard</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- The public shell, as the model and submission pages are: shell.js swaps in the
         sidebar for a signed-in reader, so the leaderboard sits inside the app for them and
         stands alone for a visitor. Nothing on it is private — only the shell changes. -->
    <div class="main">
      <nav class="nav" id="top-nav"></nav>

      <aside class="sidebar" id="side-nav" hidden></aside>

      <div class="content">
        <div id="container"></div>
      </div>
    </div>

    <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
    <!-- Chart.js as a UMD global, matching how Tabulator and lucide are loaded: the comparison
     under the board plots one task across models, and charts/chart.js says which script is
     missing if it isn't there. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
    <script type="module" src="/js/nav/navTop.js"></script>
    <script type="module" src="/js/nav/navSide.js"></script>
    <script type="module" src="/js/pages/leaderboard.js"></script>
  </body>
</html>

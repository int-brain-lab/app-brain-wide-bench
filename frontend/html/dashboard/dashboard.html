<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrainWideBench - Dashboard</title>
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <!-- Handshakes for the script origins at the end of the body. -->
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://cdn.auth0.com" />
    <!-- Tabulator's stylesheet first so style.css's `.tabulator` overrides win, same order as
       the other pages that mount a grid. -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body data-view="private">
    <div class="main-private">
      <nav class="nav" id="top-nav"></nav>
      <aside class="sidebar" id="side-nav"></aside>

      <div class="content-private">
        <div class="card" id="gate" hidden>
          <div class="column gap-lg">
            <p>Please sign in to view your dashboard.</p>
            <span data-role="gate-login"></span>
          </div>
        </div>

        <div id="container"></div>
      </div>
    </div>

    <!-- Cloned into the page by dashboardView.js when the account has no teams, models or
         submissions — the four sections would otherwise all read "None yet", which says what
         is missing but not what to do about it.

         A <template> rather than a hidden div: showGate sets `hidden` on every sibling of
         #gate, so a plain div here would be un-hidden on sign-in and have to be hidden again
         by every view. Template content is inert either way. -->
    <template id="dashboard-empty">
      <div class="card column gap-xl">
        <div class="column gap-sm">
          <p class="title">Getting started</p>
          <p class="section-description">
            Welcome to the BrainWideBench dashboard! Follow the steps below to set up your account
            and start benchmarking.
          </p>
        </div>

        <div class="column gap-xl">
          <div class="step">
            <span class="step-number">1</span>
            <div class="column left gap-sm">
              <p class="title">Create or join a team</p>
              <p class="metadata">
                A team owns the models and submissions made under it, and team membership controls
                access. Join an existing team by sharing your email with a team owner, or create a
                new team and add colleagues now or later. Colleagues must have signed in at least
                once before they can be added. If working alone, create a team of one.
              </p>
              <a class="btn primary with-icon" href="/html/teams/team_create.html">
                <i class="btn-icon" data-lucide="plus"></i>
                Create a team
              </a>
            </div>
          </div>

          <div class="step">
            <span class="step-number">2</span>
            <div class="column left gap-sm">
              <p class="title">Register a model</p>
              <p class="metadata">
                Models are the entities being evaluated. Register a model once, describing what it
                is, its owning team, and relevant pretraining details, with links to code, weights,
                and paper. Edit any of it afterward, and submit against the same model as many times
                as your work progresses.
              </p>
              <a class="btn primary with-icon" href="/html/models/model_create.html">
                <i class="btn-icon" data-lucide="plus"></i>
                Register a model
              </a>
            </div>
          </div>

          <div class="step">
            <span class="step-number">3</span>
            <div class="column left gap-sm">
              <p class="title">Make a submission</p>
              <p class="metadata">
                A submission is a zip of your model's predictions for any subset of the tasks,
                generated using the utilities in the codepack. During upload, fill in details on how
                the predictions were generated. Once uploaded, predictions are scored automatically
                and, if made public, appear on the leaderboard.
              </p>
              <a class="btn primary with-icon" href="/html/submissions/submission_create.html">
                <i class="btn-icon" data-lucide="plus"></i>
                Make a submission
              </a>
            </div>
          </div>
        </div>

        <p class="info-msg">
          After that, this page fills in on its own: your teams and models appear as cards, your
          most recent submissions as a table, and your best task scores beside them. Scoring is not
          instant — a submission sits at "pending" until it has been through the pipeline, so scores
          may take a little while to show up after you upload.
        </p>
      </div>
    </template>

    <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
    <!-- Chart.js as a UMD global, matching how Tabulator and lucide are loaded: the task-score
       explorer plots a comparison here, and charts/chart.js says which script is missing if
       it isn't there. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@1.42.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
    <script type="module" src="/js/nav/navTop.js"></script>
    <script type="module" src="/js/nav/navSide.js"></script>
    <script type="module" src="/js/pages/dashboard.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain-Wide Bench - Submission</title>
    <!-- Tabulator's stylesheet first so style.css's `.tabulator` overrides win, same order as
       the other pages that mount a grid. Without it Tabulator's JS still builds its rows —
       it renders nested divs rather than a real <table> — but every cell falls back to a
       plain block and the whole grid stacks vertically. -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <!-- One URL for both audiences, and no gate: a public submission is readable signed
         out. The markup is the public shell — what a visitor should see, painted before any
         script runs — and shell.js swaps in the sidebar for a signed-in reader. -->
    <div class="main">
      <nav class="nav" id="top-nav"></nav>

      <aside class="sidebar" id="side-nav" hidden></aside>

      <div class="content">
        <div id="container"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
    <script type="module" src="/js/nav/navTop.js"></script>
    <script type="module" src="/js/nav/navSide.js"></script>
    <script type="module" src="/js/pages/submissionView.js"></script>
  </body>
</html>

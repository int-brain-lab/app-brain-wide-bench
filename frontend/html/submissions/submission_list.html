<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain-Wide Bench - My submissions</title>
  <!-- Tabulator's stylesheet first so style.css's `.tabulator` overrides win, same order as
       the other pages that mount a grid. -->
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body data-view="private">

    <div class="main-private">

      <aside class="sidebar" id="side-nav"></aside>

      <div class="content-private">

        <div class="card" id="gate" hidden>
          <div class="column gap-md">
            <p>Please sign in to view your submissions.</p>
            <button class="btn primary" id="gate-login">Sign in</button>
          </div>
        </div>

        <div id="container"></div>

      </div>
    </div>

  <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
  <script type="module" src="/js/nav/navTop.js"></script>
  <script type="module" src="/js/nav/navSide.js"></script>
  <script type="module" src="/js/pages/submissionList.js"></script>

</body>
</html>
